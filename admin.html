<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Studio • Ananya's Craft & Creativity</title><link rel="stylesheet" href="style.css"><style>
body{background:#f7eee3}.admin{max-width:1150px;margin:auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top img{width:180px}.top h1{font:600 48px "Cormorant Garamond"}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.box{background:#fffaf3;border:1px solid #e5d6c7;padding:22px}.box h2{font:600 30px "Cormorant Garamond";margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d9c7b7;background:#fff;font:12px Inter}.field textarea{min-height:75px}.upload{display:block;padding:16px;text-align:center;border:1px dashed #c7ae9c;background:#f7ede4;cursor:pointer}.upload input{display:none}.preview{height:180px;margin-top:8px;background:#eadbd0;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.admin-btn{border:0;background:#4b2a1e;color:white;padding:12px 18px;cursor:pointer}.row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #eadbd0;align-items:center}.thumb{width:70px;height:70px;background:#eadbd0;overflow:hidden;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.row h3{font:600 20px "Cormorant Garamond";margin:0}.meta{font-size:9px;color:#8d796e;margin-top:3px}.actions{display:flex;gap:5px}.actions button{border:1px solid #d4c0b0;background:white;padding:8px;font-size:9px;cursor:pointer}.actions .del{color:#a33}.search-admin{width:100%;padding:11px;border:1px solid #d9c7b7;margin-bottom:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.top h1{font-size:38px}.row{grid-template-columns:55px 1fr}.actions{grid-column:2}}
</style></head><body><div class="admin"><div class="top"><img src="logo.png"><h1>Product Studio</h1><a class="outline" href="index.html">← View Shop</a></div><div class="grid"><section class="box"><h2 id="title">Add a product</h2><form id="form"><input type="hidden" id="id"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Category</label><select id="cat"></select></div><div class="field"><label>Price</label><input id="price" type="number" min="0" required></div><div class="field"><label>Stock</label><input id="stock" type="number" min="0" required></div><div class="field"><label>Badge</label><select id="badge"><option value="">None</option><option>New</option><option>Best Seller</option><option>Custom</option></select></div><div class="field"><label>Image</label><label class="upload">📸 Choose image from Mac<input id="file" type="file" accept="image/*"></label><div class="preview" id="preview">Image preview</div></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><button class="admin-btn">Save Product</button><button type="button" class="outline" id="clear">Clear</button></form></section><section class="box"><h2>Your Products</h2><input class="search-admin" id="search" placeholder="Search products"><div id="list"></div></section></div></div><script>
const cats=["Rakhi","Jewellery","Hair Accessories","Gifts","Custom Creations","Home Decor","Skincare","New Arrivals","Best Sellers"];let products=JSON.parse(localStorage.getItem("ananyaProducts")||"null")||[{id:1,name:"Blush Bloom Rakhi",cat:"Rakhi",price:249,stock:10,badge:"New",desc:"A delicate handmade floral rakhi.",image:""},{id:2,name:"Pearl Petal Bracelet",cat:"Jewellery",price:399,stock:8,badge:"",desc:"Soft pearls with a handcrafted finish.",image:""},{id:3,name:"Little Love Gift",cat:"Gifts",price:499,stock:5,badge:"Best Seller",desc:"A thoughtful handmade gift set.",image:""},{id:4,name:"Handmade Glow",cat:"Skincare",price:299,stock:9,badge:"",desc:"A gentle handmade self-care pick.",image:""}],img="";const $=x=>document.getElementById(x);$("cat").innerHTML=cats.map(x=>`<option>${x}</option>`).join("");function save(){localStorage.setItem("ananyaProducts",JSON.stringify(products));render()}function render(){let q=$("search").value.toLowerCase();$("list").innerHTML=products.filter(p=>(p.name+" "+p.cat).toLowerCase().includes(q)).map(p=>`<div class="row"><div class="thumb">${p.image?`<img src="${p.image}">`:"✿"}</div><div><h3>${p.name}</h3><div class="meta">${p.cat} · ₹${p.price} · Stock ${p.stock}${p.badge?" · "+p.badge:""}</div><div class="meta">${p.desc||""}</div></div><div class="actions"><button onclick="edit(${p.id})">Edit</button><button class="del" onclick="del(${p.id})">Delete</button></div></div>`).join("")||"<p>No products.</p>"}$("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{img=r.result;$("preview").innerHTML=`<img src="${img}">`};r.readAsDataURL(f)};$("form").onsubmit=e=>{e.preventDefault();let id=+$("id").value,d={name:$("name").value.trim(),cat:$("cat").value,price:+$("price").value,stock:+$("stock").value,badge:$("badge").value,desc:$("desc").value.trim(),image:img};if(id){let i=products.findIndex(p=>p.id===id);products[i]={...products[i],...d,image:img||products[i].image}}else products.unshift({...d,id:Date.now()});save();clear();alert("Product saved.")};function clear(){$("id").value="";$("name").value="";$("price").value="";$("stock").value="";$("badge").value="";$("desc").value="";$("file").value="";img="";$("preview").textContent="Image preview";$("title").textContent="Add a product"}function edit(id){let p=products.find(x=>x.id===id);$("id").value=p.id;$("name").value=p.name;$("cat").value=p.cat;$("price").value=p.price;$("stock").value=p.stock;$("badge").value=p.badge||"";$("desc").value=p.desc||"";img=p.image||"";$("preview").innerHTML=img?`<img src="${img}">`:"Image preview";$("title").textContent="Edit product";scrollTo({top:0,behavior:"smooth"})}function del(id){if(confirm("Delete this product?")){products=products.filter(p=>p.id!==id);save()}}$("clear").onclick=clear;$("search").oninput=render;render();
</script></body></html>
