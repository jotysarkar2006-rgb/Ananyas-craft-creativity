<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel • Ananya's Craft & Creativity</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f1ec;color:#30252b;font-family:Arial,sans-serif}
.admin{max-width:1150px;margin:auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.top h1{margin:0;font-family:Georgia,serif;font-size:42px}.top a{color:#8e4e70;text-decoration:none}
.grid{display:grid;grid-template-columns:380px 1fr;gap:20px}.card{background:#fff;border:1px solid #eadfd9;border-radius:12px;padding:22px;box-shadow:0 5px 20px #00000008}
.card h2{font-family:Georgia,serif;margin:0 0 18px}.field{margin:14px 0}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;color:#765f69}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd0d6;border-radius:7px;outline:none;background:#fff}.field textarea{min-height:90px;resize:vertical}
.upload{border:2px dashed #cda7ba;border-radius:8px;padding:18px;text-align:center;cursor:pointer;background:#fff8fb}.upload input{display:none}
.preview{height:180px;margin-top:10px;background:#f2e6e2;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#927d87}.preview img{width:100%;height:100%;object-fit:cover}
.save{width:100%;padding:13px;border:0;border-radius:7px;background:#9e567d;color:white;font-weight:bold;cursor:pointer}.clear{width:100%;margin-top:8px;padding:11px;background:white;border:1px solid #c9adb9;color:#8e4e70;border-radius:7px;cursor:pointer}
.search{width:100%;padding:12px;border:1px solid #ddd0d6;border-radius:7px;margin-bottom:15px}.row{display:grid;grid-template-columns:75px 1fr auto;gap:14px;padding:13px 0;border-bottom:1px solid #eee;align-items:center}
.thumb{width:75px;height:75px;background:#f2e6e2;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px}.thumb img{width:100%;height:100%;object-fit:cover}
.row h3{margin:0;font-family:Georgia,serif;font-size:20px}.meta{font-size:10px;color:#777;margin-top:5px}.actions{display:flex;gap:6px}.actions button{padding:7px 10px;border:1px solid #d8c3ce;background:white;border-radius:5px;cursor:pointer}.actions .delete{color:#a33}
.empty{text-align:center;padding:30px;color:#888}.note{background:#fff5d9;padding:12px;border-radius:7px;font-size:11px;margin-bottom:18px}
.auth{max-width:430px;margin:70px auto}.auth input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd0d6;border-radius:7px}.msg{font-size:12px;color:#8e4e70;min-height:18px}.logout{padding:9px 14px;border:1px solid #c9adb9;background:#fff;color:#8e4e70;border-radius:6px;cursor:pointer}
@media(max-width:800px){.grid{grid-template-columns:1fr}.top h1{font-size:32px}.row{grid-template-columns:60px 1fr}.actions{grid-column:2}}
</style>
</head>
<body>

<div id="loginView" class="auth card">
<h2>Admin Login</h2>
<p class="meta">Use your Supabase Auth email and password.</p>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button class="save" id="loginBtn">LOGIN</button>
<p id="authMsg" class="msg"></p>
</div>

<div id="app" style="display:none">
<div class="admin">
<div class="top">
  <h1>Product Studio</h1>
  <div>
    <a href="index.html">← View Shop</a>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>
</div>
<div class="note">Products and images are now stored in your Supabase project. Keep this admin page private.</div>

<div class="grid">
<section class="card">
<h2 id="formTitle">Add Product</h2>
<form id="productForm">
<input type="hidden" id="productId">

<div class="field"><label>Product Name</label>
<input id="name" required placeholder="Example: Handmade Rose Candle"></div>

<div class="field"><label>Category</label>
<select id="category">
<option>Home Decor</option><option>Skincare</option><option>Handmade Bags</option>
<option>Candles</option><option>Jewellery</option><option>Gift Hampers</option>
<option>Custom Order</option><option>New Arrivals</option>
</select></div>

<div class="field"><label>Price ₹</label>
<input id="price" type="number" min="0" required placeholder="499"></div>

<div class="field"><label>Stock</label>
<input id="stock" type="number" min="0" required placeholder="10"></div>

<div class="field"><label>Badge</label>
<select id="badge"><option value="">None</option><option>New</option><option>Best Seller</option><option>Sale</option></select></div>

<div class="field"><label>Product Image</label>
<label class="upload">📸 Choose Product Image
<input id="image" type="file" accept="image/*"></label>
<div class="preview" id="preview">Image preview</div></div>

<div class="field"><label>Description</label>
<textarea id="description" placeholder="Write a short product description..."></textarea></div>

<button class="save" type="submit" id="saveBtn">SAVE PRODUCT</button>
<button class="clear" type="button" id="clear">CLEAR</button>
<p id="formMsg" class="msg"></p>
</form>
</section>

<section class="card">
<h2>Your Products</h2>
<input class="search" id="search" placeholder="Search products...">
<div id="list"></div>
</section>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://qjswxsvxwgodpfxpaddd.supabase.co";
const SUPABASE_KEY="sb_publishable_8EouffYSsvjZRjiEDJ8Geg_FrzT614a";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET="product-images";
let products=[], imageFile=null, currentImageUrl="";

const $=id=>document.getElementById(id);
const setMsg=(id,text)=>$(id).textContent=text;

async function init(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session) showApp(); else showLogin();
}
function showLogin(){$("loginView").style.display="block";$("app").style.display="none"}
function showApp(){$("loginView").style.display="none";$("app").style.display="block";loadProducts()}

$("loginBtn").onclick=async()=>{
  setMsg("authMsg","Signing in...");
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||!password){setMsg("authMsg","Enter email and password.");return}
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){setMsg("authMsg",error.message);return}
  setMsg("authMsg",""); showApp();
};

$("logoutBtn").onclick=async()=>{
  await supabaseClient.auth.signOut(); showLogin();
};

async function loadProducts(){
  const {data,error}=await supabaseClient.from("products").select("*").order("created_at",{ascending:false});
  if(error){setMsg("formMsg","Could not load products: "+error.message);return}
  products=data||[]; renderProducts();
}

function renderProducts(){
  const q=$("search").value.toLowerCase();
  const list=products.filter(p=>(p.name+" "+p.category).toLowerCase().includes(q));
  $("list").innerHTML=list.length?list.map(p=>`
  <div class="row">
    <div class="thumb">${p.image_url?`<img src="${p.image_url}" alt="">`:"✿"}</div>
    <div>
      <h3>${escapeHtml(p.name)}</h3>
      <div class="meta">${escapeHtml(p.category)} · ₹${p.price} · Stock: ${p.stock}${p.badge?" · "+escapeHtml(p.badge):""}</div>
      <div class="meta">${escapeHtml(p.description||"")}</div>
    </div>
    <div class="actions">
      <button onclick="editProduct('${p.id}')">Edit</button>
      <button class="delete" onclick="deleteProduct('${p.id}')">Delete</button>
    </div>
  </div>`).join(""):`<div class="empty">No products yet.<br><br>Add your first product from the left.</div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

$("image").addEventListener("change",e=>{
  imageFile=e.target.files[0]||null;
  if(!imageFile)return;
  if(imageFile.size>5*1024*1024){alert("Please choose an image under 5 MB.");$("image").value="";imageFile=null;return}
  const reader=new FileReader();
  reader.onload=()=>{$("preview").innerHTML=`<img src="${reader.result}" alt="Preview">`};
  reader.readAsDataURL(imageFile);
});

async function uploadImage(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path=`${crypto.randomUUID()}.${ext}`;
  const {error}=await supabaseClient.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
  if(error)throw error;
  const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

$("productForm").addEventListener("submit",async e=>{
  e.preventDefault();
  $("saveBtn").disabled=true; setMsg("formMsg","Saving...");
  try{
    let image_url=currentImageUrl;
    if(imageFile) image_url=await uploadImage(imageFile);

    const payload={
      name:$("name").value.trim(),
      category:$("category").value,
      price:Number($("price").value),
      stock:Number($("stock").value),
      badge:$("badge").value||null,
      description:$("description").value.trim()||null,
      image_url:image_url||null
    };
    const id=$("productId").value;
    let error;
    if(id){
      ({error}=await supabaseClient.from("products").update(payload).eq("id",id));
    }else{
      ({error}=await supabaseClient.from("products").insert(payload));
    }
    if(error)throw error;
    clearForm(); await loadProducts(); setMsg("formMsg","Product saved successfully.");
  }catch(err){setMsg("formMsg",err.message)}
  finally{$("saveBtn").disabled=false}
});

function editProduct(id){
  const p=products.find(x=>x.id===id); if(!p)return;
  $("productId").value=p.id;$("name").value=p.name;$("category").value=p.category;
  $("price").value=p.price;$("stock").value=p.stock;$("badge").value=p.badge||"";
  $("description").value=p.description||"";currentImageUrl=p.image_url||"";imageFile=null;
  $("image").value="";$("preview").innerHTML=currentImageUrl?`<img src="${currentImageUrl}" alt="">`:"Image preview";
  $("formTitle").textContent="Edit Product";window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  if(!confirm("Delete "+p.name+"?"))return;
  const {error}=await supabaseClient.from("products").delete().eq("id",id);
  if(error){alert(error.message);return}
  await loadProducts();
}

function clearForm(){
  $("productId").value="";$("name").value="";$("price").value="";$("stock").value="";
  $("badge").value="";$("description").value="";$("image").value="";
  $("preview").textContent="Image preview";$("formTitle").textContent="Add Product";
  imageFile=null;currentImageUrl="";
}
$("clear").onclick=clearForm;
$("search").oninput=renderProducts;

supabaseClient.auth.onAuthStateChange((_event,session)=>{if(session)showApp();else showLogin()});
init();
</script>
</body>
</html>
